# Demo config for the face-detection still in the README.
#
# Detection-only: face_detect uses just the SCRFD engine. The encoding
# block is required by the config loader but unused by face_detect.
#
#   ./build/face_detect --config configs/demo_faces.yaml \
#       --input group.jpg --output group_annotated.jpg

detection:
  engine_path: "models/engines/scrfd_10g_fp16.engine"
  input_width: 640
  input_height: 640
  confidence_threshold: 0.4
  nms_iou_threshold: 0.4

encoding:
  engine_path: "models/engines/arcface_r50_fp16.engine"   # unused by face_detect
  input_size: 112
  embedding_dim: 512
  batch_size: 32

logging:
  level: "info"
  json: false
